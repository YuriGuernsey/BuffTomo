name: Update BuffTomo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PET_USER: ${{ github.repository_owner }}
          PET_MONSTER: "beastor"          # beastor | drako | pumpkin | neko | shadow | random
          PET_TZ_OFFSET_MINUTES: "60"     # Guernsey: 60 in summer (BST), 0 in winter
          PET_WATCHED_REPOS: ""
          PET_NAME: ""
          PET_CAT_NAME: ""                # empty = the species name ("Beastor is content")
          PET_CONTACT: ""
        run: bun generate.ts

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Update BuffTomo state [skip ci]"
          git push
